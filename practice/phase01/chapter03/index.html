<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Management</title>
</head>
<body>
  <header>
    <h1>Member Management</h1>
    <nav>
      <a href="https://github.com/cyw0927/fullstack-web-course" target="_blank" rel="noopener noreferrer">
        Course GitHub
      </a>
      <a href="assignment.html">수강 신청 과제 보기</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>학습자 프로필</h2>
      <img src="images/profile.png" alt="파란 지구와 네트워크 배경의 조영우(cyw0927) 프로필 일러스트" width="300" height="300">
      <p>이름: 조영우</p>
      <p>닉네임: cyw0927</p>
    </section>

    <section>
      <h2>Frontend Learning</h2>
      <img
        src="https://raw.githubusercontent.com/GilbertMoon/fullstack-web-course/main/assets/images/phase01/overview/01-fullstack-roadmap.svg"
        alt="Full-stack 학습 로드맵"
        width="600"
      >
    </section>

    <section>
      <h2>회원 목록</h2>
      <table>
        <caption>회원 목록 (학습용 예시 데이터)</caption>
        <thead>
          <tr>
            <th scope="col">ID</th>
            <th scope="col">이름</th>
            <th scope="col">이메일</th>
            <th scope="col">나이</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1</td>
            <td>김민수</td>
            <td>minsu@example.com</td>
            <td>25</td>
          </tr>
          <tr>
            <td>2</td>
            <td>이서연</td>
            <td>seoyeon@example.com</td>
            <td>28</td>
          </tr>
        </tbody>
      </table>
    </section>

    <section>
      <h2>회원 등록</h2>
      <form>
        <div>
          <label for="name">이름</label>
          <input id="name" name="name" type="text" required>
        </div>

        <div>
          <label for="email">이메일</label>
          <input id="email" name="email" type="email" required>
        </div>

        <div>
          <label for="age">나이</label>
          <input id="age" name="age" type="number" min="1">
        </div>

        <button type="submit">회원 등록</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Frontend Basic - Chapter 03</p>
  </footer>
</body>
</html>
